<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="OpenMind — Learn. Practice. Evolve.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <title>OpenMind — Learn. Practice. Evolve.</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand">OpenMind</div>
        <div class="tagline">Learn. Practice. Evolve.</div>
      </div>
      <button id="languageBtn" class="icon-btn" aria-label="Idioma">PT</button>
    </header>

    <main id="app" class="content">
      <section class="hero-card">
        <span class="eyebrow" data-i18n="dashboard">DASHBOARD</span>
        <h1 id="greeting">Bom dia!</h1>
        <p data-i18n="ready">Seu plano de estudos começa aqui.</p>
        <div class="training-card">
          <div>
            <span class="muted" data-i18n="todaysTraining">Treino de hoje</span>
            <strong>60 min</strong>
          </div>
          <a class="primary-btn" href="pages/training.html" data-i18n="startTraining">COMEÇAR TREINO</a>
        </div>
      </section>

      <section class="stats-grid">
        <article class="stat-card"><span data-i18n="streak">Sequência</span><strong>0 🔥</strong></article>
        <article class="stat-card"><span>XP</span><strong>0</strong></article>
        <article class="stat-card"><span data-i18n="accuracy">Acertos</span><strong>0%</strong></article>
        <article class="stat-card"><span data-i18n="studyTime">Tempo</span><strong>0h</strong></article>
      </section>

      <section id="cardRevisao" class="review-card oculto-auth">
        <p id="textoRevisao"></p>
        <a id="btnRevisar" class="primary-btn" href="pages/training.html?revisao=1" data-i18n="reviewNow">REVISAR AGORA</a>
      </section>

      <section class="section">
        <div class="section-head"><h2 data-i18n="subjects">Matérias</h2><a href="pages/subjects.html" data-i18n="seeAll">Ver todas</a></div>
        <div id="subjectPreview" class="subject-list"></div>
      </section>

      <a href="pages/vocabulary.html" class="vocab-card-dashboard">
        <div>
          <strong data-i18n="technicalEnglish">Technical English</strong>
          <div><small id="vocabResumoDashboard">—</small></div>
        </div>
        <span class="arrow">›</span>
      </a>

      <a href="pages/simulator.html" class="vocab-card-dashboard">
        <div>
          <strong data-i18n="simulator">Simulado</strong>
          <div><small data-i18n="setupSimulated">Configure seu simulado</small></div>
        </div>
        <span class="arrow">›</span>
      </a>
    </main>

    <nav class="bottom-nav">
      <a class="active" href="index.html">⌂<span data-i18n="home">Início</span></a>
      <a href="pages/training.html">🎯<span data-i18n="training">Treino</span></a>
      <a href="pages/subjects.html">📚<span data-i18n="subjects">Matérias</span></a>
      <a href="pages/progress.html">📊<span data-i18n="progress">Progresso</span></a>
      <a href="pages/profile.html">👤<span data-i18n="profile">Perfil</span></a>
    </nav>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/openmind-config.js"></script>
  <script src="js/openmind-data.js"></script>
  <script src="js/subjects-service.js"></script>
  <script src="js/adaptive-service.js"></script>
  <script src="js/data/openmind-vocabulary.js"></script>
  <script src="js/vocabulary-service.js"></script>
  <script src="js/language.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
