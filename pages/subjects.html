<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/style.css">
<title>OpenMind — Matérias</title>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div>
      <div class="brand">OpenMind</div>
      <div class="tagline">Learn. Practice. Evolve.</div>
    </div>
    <button id="languageBtn" class="icon-btn">PT</button>
  </header>

  <main class="content">
    <section class="section">
      <div class="section-head"><h2 data-i18n="subjects">Matérias</h2></div>
      <div id="subjects" class="subject-list">
        <p class="carregando-add">Carregando...</p>
      </div>

      <button id="btnMostrarAddMateria" class="botao-adicionar" data-i18n="addSubject">+ Add Subject</button>

      <form id="formAddMateria" class="form-add oculto-auth">
        <h3 data-i18n="newSubject">Nova matéria</h3>
        <label class="campo-add">
          <span data-i18n="namePt">Nome em português</span>
          <input type="text" id="materiaNomePt" required>
        </label>
        <label class="campo-add">
          <span data-i18n="nameEn">Name in English</span>
          <input type="text" id="materiaNomeEn" required>
        </label>
        <label class="campo-add">
          <span data-i18n="descriptionOpt">Descrição (opcional)</span>
          <textarea id="materiaDescricao" rows="2"></textarea>
        </label>
        <div class="form-add-acoes">
          <button type="button" id="btnCancelarAddMateria" class="botao-secundario" data-i18n="cancel">Cancelar</button>
          <button type="submit" class="botao-primario-add" data-i18n="save">Salvar</button>
        </div>
      </form>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="../index.html">⌂<span data-i18n="home">Início</span></a>
    <a href="training.html">🎯<span data-i18n="training">Treino</span></a>
    <a class="active" href="subjects.html">📚<span data-i18n="subjects">Matérias</span></a>
    <a href="progress.html">📊<span data-i18n="progress">Progresso</span></a>
    <a href="profile.html">👤<span data-i18n="profile">Perfil</span></a>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/openmind-config.js"></script>
<script src="../js/openmind-data.js"></script>
<script src="../js/subjects-service.js"></script>
<script src="../js/adaptive-service.js"></script>
<script src="../js/language.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {

    let uidAtual = null;

    OPENMIND_protegerPagina((usuario) => {
        uidAtual = usuario.uid;
        OPENMIND_garantirMateriasSemeadas().then(renderizarMaterias);
    });

    function renderizarMaterias() {
        Promise.all([
            OPENMIND_listarMaterias(),
            OPENMIND_obterProgressoTodasMaterias(uidAtual)
        ]).then(([materias, progressoPorMateria]) => {
            const lang = getLang();
            document.getElementById("subjects").innerHTML = materias.map(m => {
                const status = OPENMIND_statusMateria(progressoPorMateria[m.id]);
                return `
                <a class="subject-card" href="subject.html?id=${m.id}">
                    <div style="flex:1">
                        <strong>${lang === "en" ? m.nameEn : m.namePt}</strong>
                        <small>${OPENMIND_traduzirStatus(status.chave)}</small>
                        <div class="barra-materia"><div class="barra-materia-preenchimento" style="width:${status.percentual}%"></div></div>
                    </div>
                    <span class="arrow">›</span>
                </a>
            `;
            }).join("");
        });
    }

    const form = document.getElementById("formAddMateria");
    const btnMostrar = document.getElementById("btnMostrarAddMateria");
    const btnCancelar = document.getElementById("btnCancelarAddMateria");

    btnMostrar.addEventListener("click", () => form.classList.remove("oculto-auth"));
    btnCancelar.addEventListener("click", () => form.classList.add("oculto-auth"));

    form.addEventListener("submit", evento => {
        evento.preventDefault();
        OPENMIND_adicionarMateria({
            namePt: document.getElementById("materiaNomePt").value.trim(),
            nameEn: document.getElementById("materiaNomeEn").value.trim(),
            descriptionPt: document.getElementById("materiaDescricao").value.trim()
        }).then(() => {
            form.reset();
            form.classList.add("oculto-auth");
            renderizarMaterias();
        });
    });
});
</script>
</body>
</html>
