<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../css/style.css">
<title>OpenMind — Perfil</title>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div>
      <div class="brand">OpenMind</div>
      <div class="tagline">Learn. Practice. Evolve.</div>
    </div>
    <button id="languageBtn" class="icon-btn" aria-label="Idioma">PT</button>
  </header>

  <main class="content">
    <section class="hero-card">
      <span class="eyebrow">PROFILE</span>
      <h1 id="perfilNome">Seu perfil</h1>
      <p id="perfilResumo">Idioma: Português</p>
    </section>

    <section class="stats-grid">
      <article class="stat-card"><span data-i18n="levelLabel">Nível</span><strong id="perfilNivel">1</strong></article>
      <article class="stat-card"><span>XP</span><strong id="perfilXp">0</strong></article>
      <article class="stat-card"><span data-i18n="streak">Sequência</span><strong id="perfilStreak">0 🔥</strong></article>
      <article class="stat-card"><span data-i18n="exercises">Exercícios</span><strong id="perfilExercicios">0</strong></article>
    </section>

    <section class="section">
      <div class="section-head"><h2 data-i18n="achievements">Conquistas</h2></div>
      <div id="listaConquistas" class="conquistas-grid"></div>
    </section>

    <section class="section">
      <div class="subject-list">
        <div class="subject-card">
          <div><strong>Language / Idioma</strong><small>Português / English</small></div>
          <span>›</span>
        </div>
        <button id="btnSair" class="subject-card" style="border:none;width:100%;cursor:pointer;">
          <div><strong data-i18n="logout">Sair</strong></div>
          <span>⏻</span>
        </button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="../index.html">⌂<span data-i18n="home">Início</span></a>
    <a href="training.html">🎯<span data-i18n="training">Treino</span></a>
    <a href="subjects.html">📚<span data-i18n="subjects">Matérias</span></a>
    <a href="progress.html">📊<span data-i18n="progress">Progresso</span></a>
    <a class="active" href="profile.html">👤<span data-i18n="profile">Perfil</span></a>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/gamification-service.js"></script>
<script src="../js/language.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    OPENMIND_protegerPagina((usuario, perfil) => {
        const lang = getLang();

        document.getElementById("perfilNome").textContent = perfil.name || usuario.email;
        document.getElementById("perfilResumo").textContent =
            (lang === "en" ? "Language: " : "Idioma: ") + (perfil.language === "en" ? "English" : "Português");

        document.getElementById("perfilNivel").textContent = OPENMIND_calcularNivel(perfil.xp);
        document.getElementById("perfilXp").textContent = perfil.xp || 0;
        document.getElementById("perfilStreak").textContent = (perfil.streak || 0) + " 🔥";
        document.getElementById("perfilExercicios").textContent = perfil.exercisesDone || 0;

        const desbloqueadas = OPENMIND_conquistasDesbloqueadas(perfil);
        const idsDesbloqueadas = new Set(desbloqueadas.map(c => c.id));

        document.getElementById("listaConquistas").innerHTML = OPENMIND_CONQUISTAS.map(c => {
            const ok = idsDesbloqueadas.has(c.id);
            const nome = lang === "en" ? c.nameEn : c.namePt;
            return `
            <div class="conquista-card ${ok ? "desbloqueada" : "bloqueada"}">
                <span class="conquista-icone">${c.icone}</span>
                <small>${nome}</small>
            </div>`;
        }).join("");
    });

    document.getElementById("btnSair").addEventListener("click", () => OPENMIND_sair());
});
</script>
</body>
</html>
